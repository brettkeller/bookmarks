<!-- Open this file in a browser, right-click each canvas, "Save image as" icon16.png, icon48.png, icon128.png -->
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function draw(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  // Background rounded rect
  const r = s * 0.15;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#4285f4';
  ctx.fill();
  // Bookmark icon (star)
  ctx.fillStyle = '#fff';
  const cx = s / 2, cy = s * 0.45, sr = s * 0.25;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (i * 4 * Math.PI / 5) - Math.PI / 2;
    const method = i === 0 ? 'moveTo' : 'lineTo';
    ctx[method](cx + sr * Math.cos(a), cy + sr * Math.sin(a));
  }
  ctx.closePath();
  ctx.fill();
  // Three lines (spreadsheet)
  const lw = s * 0.06;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const y = s * 0.72 + i * s * 0.08;
    ctx.beginPath();
    ctx.moveTo(s * 0.25, y);
    ctx.lineTo(s * 0.75, y);
    ctx.stroke();
  }
}
draw(document.getElementById('c16'));
draw(document.getElementById('c48'));
draw(document.getElementById('c128'));
</script>
